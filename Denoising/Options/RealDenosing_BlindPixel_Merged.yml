# ============================================================
#  Restormer 红外盲元修复 — 合并训练配置
# ============================================================

name: RealDenosing_BlindPixel_Merged
model_type: ImageCleanModel
scale: 1
num_gpu: 1           # GPU 数量
manual_seed: 100

# ============================================================
#  数据集 — 修改这里指向新数据
# ============================================================
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage_BlindPixel
    dataroot_gt: data_merged/train_sharp     # ← 干净 GT 路径
    dataroot_lq: data_merged/train_blur      # ← 含盲元图像路径
    in_ch: 1                                 # 1=灰度, 3=RGB
    blind_weight: 0.0
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 0       # 0 = 不 spawn 子进程(Windows 页面文件不足时 spawn 会报 WinError 1455); 调大页面文件后可回调 4
    batch_size_per_gpu: 1       # 数据加载 batch（和 mini_batch_sizes 保持一致，否则加载了会被随机丢弃）
    pin_memory: true
    prefetch_mode: cuda

    mini_batch_sizes: [1]       # 实际训练 batch：24G 卡 384 patch 只能 1（实测 13G）；≥64G 卡可设 [4]（实测 51G）
    iters: [60000]              # ← 长跑阶段: 探针确认 2e-5 稳定(44.6+)后拉长; 续训从 latest.pth 自动接续
    gt_size: 384                # 训练 patch 大小（推理分块必须 ≥ 它；640×512 分块实测无拼接痕迹）
    gt_sizes: [384]
    dataset_enlarge_ratio: 1

  val:
    name: ValSet
    type: Dataset_PairedImage_BlindPixel
    dataroot_gt: data_merged/test_sharp      # ← 验证 GT 路径
    dataroot_lq: data_merged/test_blur       # ← 验证 blur 路径
    in_ch: 1
    blind_weight: 0.0
    filename_tmpl: '{}'
    io_backend:
      type: disk

# ============================================================
#  网络结构 — 一般不改
# ============================================================
network_g:
  type: Restormer
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: BiasFree
  dual_pixel_task: False

# ============================================================
#  路径 — pretrain 可设旧权重做 warm-start
# ============================================================
path:
  pretrain_network_g: experiments/RealDenosing_BlindPixel_Merged_warmstart.pth  # warm-start 副本(位于 experiments 根目录, 不会被归档卷走); 正常运行时 latest.pth 优先, 此项仅在 latest/best 都缺失时生效
  strict_load_g: true
  resume_state: ~              # 自动检测 latest.pth, 无需手动设

# ============================================================
#  训练参数
# ============================================================
train:
  total_iter: 60000            # ← 长跑阶段: 和 iters 一致
  warmup_iter: -1
  use_grad_clip: true
  use_fp16: true               # 混合精度
  blind_weight: 0.0

  scheduler:                   # 余弦退火重启: 每段长度之和 = total_iter
    type: CosineAnnealingRestartCyclicLR
    periods: [60000]                        # ← 长跑: 单周期余弦 60k (多周期重启会把 lr 打回满值, 不适合微调)
    restart_weights: [1]                    # ← 和 periods 等长
    eta_mins: [0.000001]                    # ← 和 periods 等长

  mixing_augs:
    mixup: false

  optim_g:
    type: AdamW
    lr: !!float 2e-5            # 微调口径: 从收敛模型出发需更低 lr (1e-4 会把权重冲散); 从零训练时用 1e-4
    weight_decay: !!float 1e-3
    betas: [0.9, 0.999]

  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# ============================================================
#  验证
# ============================================================
val:
  window_size: 8
  val_freq: 4000               # 长跑阶段: 验证拉回每 4000 一次 (与历史曲线口径一致)
  save_img: false              # 保持关闭节省验证时间 (要看修复效果用 process_raw.py 推一帧即可)
  rgb2bgr: false
  use_image: true
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# ============================================================
#  日志
# ============================================================
logger:
  print_freq: 200              # 每 N iter 打印一次
  save_checkpoint_freq: 999999 # 不需要中间保存 (仅 latest.pth)
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  # backend: nccl
  # port: 29500
